<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092520"/>
      <stop offset="100%" stop-color="#10523e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="caustics" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0 50 Q 25 30 50 50 T 100 50" fill="none" stroke="rgba(0, 210, 190, 0.15)" stroke-width="2"/>
      <path d="M 0 80 Q 25 60 50 80 T 100 80" fill="none" stroke="rgba(255, 107, 53, 0.1)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#caustics)"/>
  <circle cx="400" cy="300" r="280" fill="url(#glow)"/>
  
  <!-- Marine elements decor -->
  <g opacity="0.4">
    <circle cx="150" cy="180" r="12" fill="#00d2be"/>
    <circle cx="170" cy="140" r="8" fill="#00d2be"/>
    <circle cx="680" cy="420" r="16" fill="#ff6b35"/>
    <circle cx="650" cy="470" r="10" fill="#ff6b35"/>
  </g>

  <!-- Central Badge -->
  <g transform="translate(400, 260)">
    <circle cx="0" cy="0" r="90" fill="rgba(13, 18, 26, 0.75)" stroke="#092520" stroke-width="4"/>
    <text x="0" y="32" font-size="76" text-anchor="middle" font-family="system-ui, sans-serif">🌿</text>
  </g>

  <!-- Typography -->
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#f0f4f8" text-anchor="middle" letter-spacing="1">Green Rhodactis Mushroom</text>
  <text x="400" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#00d2be" text-anchor="middle">Rhodactis inchoata • Corallimorph</text>
  <text x="400" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8e9fb5" text-anchor="middle">Vibrant vesicle carpet • Low-moderate current</text>
</svg>